[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recognition-service"
version = "0.1.0"
description = "VSL Sign Language Recognition Service"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "python-socketio[asgi]>=5.10.0",
  "pydantic>=2.5.0",
  "numpy>=1.24.0",
  "torch>=2.2.0",
  "transformers>=4.41.0",
  "safetensors>=0.4.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
