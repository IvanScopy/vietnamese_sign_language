version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vsl_user
      POSTGRES_PASSWORD: vsl_password
      POSTGRES_DB: vsl_bridge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsl_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}:${LIVEKIT_API_SECRET:-devsecret}"
    ports:
      - "7880:7880"    # HTTP API
      - "7881:7881"    # WebSocket
      - "7882:7882/udp" # RTC UDP
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    command: --config /etc/livekit/livekit.yaml
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
